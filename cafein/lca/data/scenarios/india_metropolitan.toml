# India, metropolitan operating conditions: a composite of Delhi and Mumbai
# surveys and Indian LCA studies. Cases are named by their effect on emissions
# per pkm: "best" holds every low-emission value, "worst" every high-emission
# one. Every parameter carries its evidence type (observed, model_input,
# capacity, projection, derived, assumption), geography, source and confidence.
#
# Sources: Goel et al. 2015 (doi 10.1016/j.tbs.2014.10.001); Goel et al. 2016
# (10.1016/j.trd.2015.05.006); Guttikunda 2024 (10.3390/su16156298); Peshin et
# al. 2022 (10.1021/acs.est.1c07718); Shinde et al. 2019
# (10.1007/s10098-018-01661-1); Shinde et al. 2024 (10.1016/j.eiar.2024.107501);
# Aryan et al. 2025a (10.1007/s43621-025-01994-0); Aryan et al. 2025b
# (10.1007/s41062-024-01852-4); Ghate & Qamar 2020 (10.1016/j.cstp.2019.01.005).
#
# Survival medians "derived from Guttikunda 2024" use the Table 5 parameters
# (alpha, beta, T) of the named vehicle category and survival case:
# median = T * ln(2)^(1/beta) - alpha.

name = "india_metropolitan"
description = "Indian metropolitan operating conditions (Delhi and Mumbai composite), three cases"

# middle: packaged India preset (~837 g CO2/kWh; CEA 2018 gives 767, Peshin 2022).
# best: assumption; the "100% natural gas" preset (~507 g/kWh) stands in for the
#   2030 grid scenarios of 410-511 g/kWh in Peshin 2022, Table 4.
# worst: assumption; "100% coal" is the upper sensitivity bound of Peshin 2022.
[power_mix]
best = "100% natural gas"
middle = "India"
worst = "100% coal"

# ---------------------------------------------------------------- private cars
[modes."private_car_*".occupancy]
best = 1.97
middle = 1.25
worst = 1.0
evidence = {best = "assumption", middle = "model_input", worst = "assumption"}
geography = {best = "Ahmedabad (abstract only)", middle = "Mumbai", worst = "n/a"}
source = {best = "Padiya & Bhatt 2020 (SSRN 3735390, not in collection)", middle = "Aryan et al. 2025a, Table 3 (Mumbai CMP 2016)", worst = "single-occupant lower bound"}
confidence = "low"

[modes."private_car_*".annual_km]
best = 12600
middle = 12200
worst = 11600
evidence = {best = "model_input", middle = "observed", worst = "observed"}
geography = "Delhi"
source = {best = "Peshin et al. 2022, Methods", middle = "Goel et al. 2015, Table 6 (all cars)", worst = "Goel et al. 2015, Table 6 (petrol cars)"}
year = {best = 2022, middle = 2015, worst = 2015}
confidence = "high"

[modes."private_car_*".lifetime_years]
