source = {best = "Guttikunda 2024, Table 5, 4W1 cars, high survival (median 14.7)", middle = "Peshin et al. 2022, Methods", worst = "Guttikunda 2024, Table 5, 4W1 cars, low survival (median 7.1)"}
year = {best = 2024, middle = 2022, worst = 2024}
