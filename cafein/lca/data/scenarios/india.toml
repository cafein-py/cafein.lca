# India: metropolitan operating conditions from Delhi and Mumbai surveys and
# Indian LCA literature. Cases are named by their effect on emissions per pkm:
# "best" stacks every low-emission assumption, "worst" every high-emission one.
# Sources (see docs/tutorials/scenarios): Goel et al. 2015 (10.1016/j.tbs.2014.10.001),
# Goel et al. 2016 (10.1016/j.trd.2015.05.006), Guttikunda 2024 (10.3390/su16156298),
# Peshin et al. 2022 (10.1021/acs.est.1c07718), Shinde et al. 2019
# (10.1007/s10098-018-01661-1), Shinde et al. 2024 (10.1016/j.eiar.2024.107501),
# Aryan et al. 2025 (10.1007/s43621-025-01994-0, 10.1007/s41062-024-01852-4),
# Ghate & Qamar 2020 (10.1016/j.cstp.2019.01.005), Padiya & Bhatt 2020
# (10.2139/ssrn.3735390).

name = "india"
description = "Indian metropolitan operating conditions (Delhi and Mumbai), three cases"

# Grid: packaged India preset (~837 g CO2/kWh; CEA 2018 gives 767, Peshin 2022).
# Best stands in for the 2030 grid scenarios of 410-511 g/kWh (Peshin Table 4);
# worst is the coal-dominated upper bound of the same study.
[power_mix]
best = "100% natural gas"
central = "India"
worst = "100% coal"

[modes."private_car_*"]
occupancy = {best = 1.97, central = 1.25, worst = 1.0}      # Padiya 2020 (Ahmedabad); Aryan 2025 Table 3 (Mumbai)
annual_km = {best = 12600, central = 12200, worst = 11600}  # Peshin 2022; Goel 2015 Table 6 (Delhi, petrol cars)
lifetime_years = {best = 15, central = 12, worst = 7}       # Guttikunda 2024 survival medians; Peshin 2022

[modes.private_car_ice]
vehicle_weight_kg = {best = 695, central = 965, worst = 1391}        # Peshin 2022 Table 2: Alto, Swift, Octavia
fuel_consumption_per_100km = {best = 4.5, central = 6.5, worst = 6.6}  # rated (Peshin) vs measured fleet (Goel 2015 Table 4)

[modes.private_car_bev]
vehicle_weight_kg = 937      # Peshin 2022 Table 2 (Mahindra e2o)
battery_capacity_kwh = 15    # Peshin 2022 Table 2
electricity_consumption_kwh_per_km = {best = 0.136, central = 0.16, worst = 0.18}  # rated range; +33 % hot weather (Peshin)

[modes."private_moped_*"]
occupancy = {best = 1.4, central = 1.4, worst = 1.0}         # Aryan 2025 Table 3
annual_km = {best = 12800, central = 9200, worst = 6300}     # Goel 2016 Table 6 (Delhi; mid-size cities); Peshin 2022
lifetime_years = {best = 12, central = 10, worst = 7}        # Guttikunda 2024; Peshin 2022

[modes.private_moped_ice]
vehicle_weight_kg = 109                                              # Peshin 2022 Table 2 (Honda Activa)
fuel_consumption_per_100km = {best = 1.7, central = 2.1, worst = 2.1}  # rated 60 km/L; measured 48.5 km/L (Goel 2015)

[modes.private_moped_bev]
vehicle_weight_kg = 87       # Peshin 2022 Table 2 (Hero Photon)
battery_capacity_kwh = 1.8   # Peshin 2022 Table 2
electricity_consumption_kwh_per_km = {best = 0.0225, central = 0.0225, worst = 0.03}  # rated range; +33 %

[modes."taxi_*"]
occupancy = {best = 4, central = 1.9, worst = 1.0}           # Shinde 2019 Table 7 (shared, average, off-peak)
annual_km = {best = 18600, central = 18600, worst = 15300}   # Shinde 2019: 51 km/day; fleet-based figure
lifetime_years = {best = 15, central = 8, worst = 8}         # Shinde 2019; 8-year Tier-1 retirement rule (Guttikunda 2024)
service_km_per_vehicle_day = {best = 9.08, central = 9.08, worst = 7.47}  # deadheading scaled to keep the model's share of daily km

[modes."bus_*"]
occupancy = {best = 92, central = 53, worst = 25}            # Shinde 2019 Table 7 (peak, average, off-peak; capacity 70)
annual_km = {best = 71175, central = 55000, worst = 44000}   # Goel 2015 (Delhi); Shinde 2019 fleet totals (Mumbai)
lifetime_years = {best = 15, central = 12, worst = 8}        # Shinde 2019 / Ghate 2020; Peshin 2022; Tier-1 median
service_km_per_vehicle_day = {best = 21.67, central = 16.74, worst = 13.39}  # deadheading scaled with annual km

[modes.bus_ice]
vehicle_weight_kg = {best = 7476, central = 9850, worst = 10398}    # Peshin 2022 (9 m bus); Shinde 2019 (12 m diesel)
fuel_consumption_per_100km = {best = 22, central = 32, worst = 35}  # rated 4.55 km/L; Mumbai fleet 3.1-3.8 km/kg

[modes.bus_bev]
vehicle_weight_kg = 8125     # Peshin 2022 Table 2 (Tata Starbus 9 m electric)
battery_capacity_kwh = 124   # Peshin 2022 Table 2
electricity_consumption_kwh_per_km = {best = 0.83, central = 0.83, worst = 1.17}  # rated range; +41 % cold weather

# Metro rows describe a six-coach Mumbai train and must move together.
[modes.metro_urban_train]
occupancy = {best = 1900, central = 1000, worst = 500}   # Shinde 2024 planned average; actual Indian ridership ~1/4 of plans
vehicle_weight_kg = 420000                               # derived from 80 kWh per 1000 gross t-km (Shinde 2024)
electricity_consumption_kwh_per_km = 44                  # traction, derived (Shinde 2024; Aryan 2025 gives 42)
lifetime_years = 30                                      # Aryan 2025; Ghate 2020
annual_km = 107000                                       # Aryan 2025, derived from 266 services/day on 16.5 km
