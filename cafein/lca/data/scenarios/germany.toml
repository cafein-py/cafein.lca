# Germany: operating conditions from German statistics, studies and operator
# reports, with the 2025 electricity mix. Cases are named by their effect on
# emissions per pkm: "best" holds every low-emission value, "worst" every
# high-emission one. Every value carries its evidence type, geography,
# source, data year and confidence. A value is overridden only where German
# (or Germany-inclusive European) evidence supports it; every other
# parameter keeps its itf-2020 default.
#
# Sources: Allekotte et al. 2020 (UBA Texte 156/2020, Ökologische Bewertung
# von Verkehrsarten); Weller et al. 2019 (doi 10.3389/fmech.2019.00045);
# Weiss et al. 2024 (10.3390/su16177529); Böhmeke & Koch 2021
# (10.1007/s41104-021-00081-6); Schelte et al. 2021 (10.3390/su13158297);
# Heide, Guo & Göhlich 2025 (10.3390/wevj16070378); Siemens Mobility,
# Avenio EPD S-P-03441 (2022) and "U-Bahn München" data sheet (2019); Alstom,
# RER NG EPD S-P-05994 (2022); MVG, "MVG in Zahlen" (2026); Hamburger
# Hochbahn AG, Lagebericht 2025; VDV-Statistik 2023; AG Energiebilanzen,
# Bruttostromerzeugung (June 2026); KBA, Verkehr in Kilometern 2025;
# Bundesnetzagentur, Marktuntersuchung Eisenbahnen 2018.

name = "germany"
description = "German operating conditions (UBA, studies, Munich and Hamburg operators) and the 2025 electricity mix, three cases"

# AG Energiebilanzen, "Bruttostromerzeugung in Deutschland nach
# Energieträgern", release 18 June 2026, 2025 column (preliminary):
# Mineralöl 4.2, Erdgas 86.3, Braunkohle 74.4 + Steinkohle 29.9, Kernenergie
# 0.0, Biomasse 42.4 + renewable Hausmüll 5.6, and other renewables 243.6 TWh
# (the published renewables total 291.6 less biomass and renewable Hausmüll;
# its listed parts, wind 134.2 + hydro 17.1 + PV 92.2 + geothermal 0.2, round
# to 243.7). Shares over these 486.4 TWh ("Sonstige", 22.8 TWh incl. pumped
# storage, has no model category). Same mix in all cases.
[power_mix]
oil = 0.00863486842105263
natural_gas = 0.17742598684210525
coal = 0.2144325657894737
nuclear = 0.0
biomass = 0.09868421052631578
other_renewables = 0.5008223684210527

