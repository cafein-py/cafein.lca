[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cafein.lca"
version = "0.1.0.dev0"
description = "Life-cycle assessment of urban passenger transport in Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Henrikki Tenkanen", email = "henrikki.tenkanen@aalto.fi" }]
keywords = [
    "cafein", "life-cycle assessment", "LCA", "transport", "mobility",
    "micromobility", "ridesourcing", "shared mobility", "GHG emissions",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/cafein-py/cafein.lca"
Documentation = "https://cafein-lca.readthedocs.io"
Repository = "https://github.com/cafein-py/cafein.lca"
"Issue Tracker" = "https://github.com/cafein-py/cafein.lca/issues"
Changelog = "https://github.com/cafein-py/cafein.lca/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "black", "flake8"]
docs = ["sphinx", "myst-nb", "sphinx-book-theme==1.2.0", "sphinx-design", "matplotlib"]
cafein = ["cafein==0.25.0"]

[tool.hatch.build.targets.wheel]
# The wheel ships the cafein/lca/ subtree only; cafein/__init__.py belongs to
# the cafein wheel, so the two never collide in site-packages.
packages = ["cafein"]

[tool.hatch.build.targets.sdist]
exclude = ["docs", "tests", "ci", ".github", ".pre-commit-config.yaml", ".readthedocs.yml"]

[tool.black]
target-version = ["py310"]
