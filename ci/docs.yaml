name: cafein-lca-docs
channels:
  - conda-forge
dependencies:
  - python=3.12
  # runtime dependencies of cafein.lca (the package itself is installed
  # from source with pip: pip install --no-deps -e .)
  - numpy
  - pandas
  # documentation build
  - sphinx
  - myst-nb
  - sphinx-book-theme=1.2.0
  - sphinx-design
  - matplotlib
  - ipykernel
  - pip
